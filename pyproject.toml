[project]
name = "polars-text"
version = "0.8.0"
description = "Polars expression plugins for text analysis"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["polars==1.44.1"]

[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "."
module-name = "polars_text._internal"
include = [{ path = "scripts/*quotation*", format = "sdist" }, { path = "scripts/vendor_udpipe.py", format = "sdist" }]

[dependency-groups]
dev = ["maturin==1.15.0", "pytest==9.1.1"]
