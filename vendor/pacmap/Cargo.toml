[package]
edition = "2021"
name = "pacmap"
version = "0.2.6"
authors = ["Joshua Griffith <joshua@beamform.io>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Pairwise Controlled Manifold Approximation (PaCMAP) for dimensionality reduction"
documentation = "https://docs.rs/pacmap"
readme = "README.md"
keywords = [
    "embedding",
    "dimension-reduction",
    "pacmap",
    "algorithms",
]
categories = [
    "science",
    "algorithms",
    "mathematics",
]
license = "Apache-2.0"
repository = "https://github.com/beamform/pacmap-rs"

[profile.bench]
