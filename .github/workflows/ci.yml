name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: polars-text-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            python-architecture: x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          architecture: ${{ matrix.python-architecture || 'x64' }}

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cache Hugging Face downloads
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            huggingface-${{ runner.os }}-

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          container: off
          rust-toolchain: stable
          sccache: ${{ runner.os != 'Windows' }}
          args: --release --locked --out dist --interpreter 3.14 --timings

      - name: Upload Cargo timing report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-${{ matrix.name }}
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore

      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip pytest==9.1.1
          # Install the freshly-built wheel by file path so pip cannot
          # silently substitute a published PyPI version (avoids the
          # ModuleNotFoundError class of failures where the local build
          # added a pure-Python module the index version doesn't have).
          # Transitive deps (polars==1.44.1) still resolve from PyPI.
          python -m pip install --force-reinstall dist/polars_text-*.whl

      - name: Download pinned quotation test model
        shell: bash
        run: python scripts/download_quotation_test_model.py "$RUNNER_TEMP/quotation.udpipe"

      - name: Run pytest
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          WORDFLOW_TEST_UDPIPE_MODEL="$RUNNER_TEMP/quotation.udpipe" python -m pytest --require-models -q "$GITHUB_WORKSPACE/tests"

      - name: Run native quotation model acceptance
        if: runner.os == 'Linux'
        shell: bash
        run: WORDFLOW_TEST_UDPIPE_MODEL="$RUNNER_TEMP/quotation.udpipe" cargo test --locked --no-default-features --features quotation -- --ignored

      - name: Build source distribution and rebuild its wheel
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pip install maturin==1.15.0
          maturin sdist --out sdist
          python -m pip wheel --no-deps --wheel-dir rebuilt sdist/*.tar.gz
          python -m pip install --force-reinstall --no-deps rebuilt/*.whl
          cd "$RUNNER_TEMP"
          WORDFLOW_TEST_UDPIPE_MODEL="$RUNNER_TEMP/quotation.udpipe" python -m pytest --require-models -q "$GITHUB_WORKSPACE/tests/test_quotation.py"

      - name: Show sccache stats
        if: always() && runner.os != 'Windows'
        continue-on-error: true
        shell: bash
        run: sccache --show-stats

  feature-checks:
    name: Cargo ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base
            args: --no-default-features
          - name: tokenization
            args: --no-default-features --features tokenization
          - name: embedding
            args: --no-default-features --features embedding
          - name: tokenization-embedding
            args: --no-default-features --features tokenization,embedding
          - name: topic
            args: --no-default-features --features topic-modeling
          - name: quotation
            args: --no-default-features --features quotation
          - name: full
            args: --all-features
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked ${{ matrix.args }}
      - run: cargo test --locked ${{ matrix.args }}

  clippy:
    name: Strict Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  reduced-wheels:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: [base, tokenization, quotation]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install maturin==1.15.0 pytest==9.1.1
      - shell: bash
        run: |
          if [ "${{ matrix.features }}" = base ]; then
            maturin build --release --locked --no-default-features --out dist
          else
            maturin build --release --locked --no-default-features --features "${{ matrix.features }}" --out dist
          fi
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -m pytest -q "$GITHUB_WORKSPACE/tests/test_installed_features.py"
