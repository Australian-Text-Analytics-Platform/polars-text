[package]
name = "polars_text"
version = "0.6.0"
edition = "2021"

[lib]
name = "polars_text"
crate-type = ["cdylib"]

[features]
default = ["full"]
full = ["topic-modeling"]
cache = ["dep:duckdb", "dep:fs2", "dep:serde_json", "dep:sha2", "dep:tempfile"]
tokenization = [
    "dep:hf-hub",
    "dep:lindera",
    "dep:tokenizers",
    "dep:ureq",
    "dep:zip",
    "dep:polars-arrow",
    "cache",
]
embedding = [
    "dep:hf-hub",
    "dep:ndarray",
    "dep:ort",
    "dep:tokenizers",
    "dep:polars-arrow",
    "cache",
]
topic-modeling = [
    "embedding",
    "tokenization",
    "dep:hdbscan",
    "dep:pacmap",
    "dep:rmp-serde",
    "dep:zstd",
]

[dependencies]
anyhow = "1.0"
duckdb = { version = "1.10504.0", features = ["bundled", "json"], optional = true }
fs2 = { version = "0.4", optional = true }
hf-hub = { version = "0.5", optional = true }
# Lindera dict download support: fetch official GitHub release zips on first use.
ureq = { version = "3", default-features = false, features = [
    "rustls",
], optional = true }
zip = { version = "7", default-features = false, features = [
    "deflate-flate2-zlib-rs",
], optional = true }
# Lindera — word/morpheme-level segmentation for Chinese (Jieba), Japanese
# (IPADIC / UniDic), and Korean (ko-dic). We deliberately avoid Lindera's
# `embed-*` features so dictionaries are not packed into the extension; every
# `lindera:*` model is downloaded into the local cache only on first use.
lindera = { version = "3", default-features = false, features = [
    "mmap",
], optional = true }
# Keep all polars crates on the exact source tree used by Python polars 1.44.1.
# Building this crate standalone in CI must not rely on an outer workspace patch,
# otherwise Cargo mixes crates.io polars 0.53.0 with git-tagged pyo3-polars and
# the resolver breaks on transitive dependencies like chrono.
polars = { git = "https://github.com/pola-rs/polars.git", tag = "py-1.44.1", default-features = false, features = [
    "fmt",
    "dtype-struct",
] }
polars-arrow = { git = "https://github.com/pola-rs/polars.git", tag = "py-1.44.1", default-features = false, optional = true }
pyo3 = "0.29"
pyo3-polars = { git = "https://github.com/pola-rs/polars.git", tag = "py-1.44.1", features = [
    "derive",
] }
regex = "1"
serde = { version = "1", features = ["derive"] }
rmp-serde = { version = "1.3", optional = true }
zstd = { version = "0.13", optional = true }
# Keep `onig` regex support, but avoid tokenizers' default `esaxx_fast` C++
# path: esaxx-rs forces /MT on MSVC, conflicting with usearch/cxx's /MD.
tokenizers = { version = "0.23", default-features = false, features = [
    "onig",
], optional = true }
unicode-segmentation = "1.13.3"

# --- Topic-modeling pipeline (Rust BERTopic replacement) ---
# src/topic_modeling/embedding.rs owns automatic hf-hub downloads and ORT
# inference. Execution-provider features are target-specific below because ORT's
# prebuilt distributions reject feature sets that are unavailable on a target.
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
tempfile = { version = "3", optional = true }
# pacmap: PaCMAP dimensionality reduction (ndarray 0.16). Used by
# src/topic_modeling/reduce.rs. The static MKL backend keeps Windows wheels
# self-contained; otherwise petal-decomposition links unresolved LAPACK symbols.
pacmap = { version = "0.2", features = ["intel-mkl-static"], optional = true }
ndarray = { version = "0.16", optional = true }
# hdbscan: density-based clustering of reduced chunk embeddings into topics.
# Used by src/topic_modeling/cluster.rs.
hdbscan = { version = "0.12", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    "download-binaries",
    "tls-native",
    "api-24",
    "coreml",
], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    "download-binaries",
    "tls-native",
    "api-24",
    "directml",
], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# ort 2.0.0-rc.13 does not publish an XNNPACK binary for this target, so use
# ONNX Runtime's built-in CPU provider rather than producing an unlinked wheel.
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    "download-binaries",
    "tls-native",
    "api-24",
], optional = true }

[target.'cfg(not(any(target_os = "macos", target_os = "windows", target_os = "linux")))'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    "download-binaries",
    "tls-native",
    "api-24",
], optional = true }

[dev-dependencies]
ahash = "0.8"

[profile.dev]
debug = 0

[profile.dev.build-override]
debug = 0

[profile.release]
strip = "symbols"
