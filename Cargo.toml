[package]
name = "polars_text"
version = "0.8.0"
edition = "2021"

[lib]
name = "polars_text"
crate-type = ["cdylib"]

[features]
default = ["full"]
full = ["topic-modeling", "quotation"]
quotation = ["ldaca-rs/quotation", "dep:polars-arrow"]
cache = ["ldaca-rs/cache"]
tokenization = ["ldaca-rs/tokenization", "dep:polars-arrow", "cache"]
embedding = ["ldaca-rs/embedding", "dep:polars-arrow", "cache"]
topic-modeling = ["ldaca-rs/topic-modeling", "embedding", "tokenization"]

[dependencies]
ldaca-rs = { git = "https://github.com/Australian-Text-Analytics-Platform/ldaca-wordflow.git", branch = "main", default-features = false }
polars = { git = "https://github.com/pola-rs/polars.git", tag = "py-1.44.1", default-features = false, features = ["fmt", "dtype-struct"] }
polars-arrow = { git = "https://github.com/pola-rs/polars.git", tag = "py-1.44.1", default-features = false, optional = true }
pyo3 = "0.29"
pyo3-polars = { git = "https://github.com/pola-rs/polars.git", tag = "py-1.44.1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 0

[profile.dev.build-override]
debug = 0

[profile.release]
strip = "symbols"
